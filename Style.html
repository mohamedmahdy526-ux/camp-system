<style>
  :root {
    --primary: #053733; /* Deep Brand Teal */
    --primary-light: #0b4d47; /* Lighter Brand Teal */
    --primary-gradient: linear-gradient(135deg, #053733 0%, #011917 100%);
    --accent: #c5a059; /* Brand Warm Gold */
    --accent-light: #e3c588; /* Brand Light Gold */
    --accent-gradient: linear-gradient(135deg, #c5a059 0%, #e3c588 100%);
    
    --bg-gradient: radial-gradient(circle at 50% 50%, #063f3a 0%, #011312 100%);
    --card-bg: rgba(4, 34, 31, 0.75);
    --card-border: rgba(197, 160, 89, 0.25);
    
    --text-main: #f3f4f6; /* Cool Grey 100 */
    --text-muted: #9ca3af; /* Cool Grey 400 */
    --text-light: #053733; /* Dark green text for contrast on gold buttons */
    
    --success: #c5a059; /* Gold for success branding */
    --success-emerald: #10b981; /* Fallback emerald green */
    --danger: #f87171; /* Red 400 */
    --warning: #fbbf24; /* Amber 400 */
    
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --shadow: 0 15px 35px -10px rgba(1, 10, 9, 0.6), 0 0 15px rgba(197, 160, 89, 0.05);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Reset & Base */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Cairo', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    direction: rtl; /* Arabic first layout */
    padding: 20px;
    overflow-x: hidden;
  }

  /* App Wrapper */
  .app-wrapper {
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 10;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 40px 30px;
    position: relative;
    overflow: hidden;
    transition: var(--transition);
  }

  /* Decorative Orbs */
  .orb-1, .orb-2 {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    opacity: 0.35;
  }
  .orb-1 {
    width: 320px;
    height: 320px;
    background: var(--accent);
    top: -160px;
    left: -160px;
  }
  .orb-2 {
    width: 260px;
    height: 260px;
    background: var(--primary-light);
    bottom: -130px;
    right: -130px;
  }

  /* Screen Transitions */
  .screen {
    display: none;
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .screen.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  /* Brand Header styling */
  .header {
    text-align: center;
    margin-bottom: 25px;
  }

  /* Circular Brand Logo Container */
  .brand-logo-container {
    width: 120px;
    height: 120px;
    margin: 0 auto 15px;
    background: #032e2b;
    border: 2px solid var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px rgba(197, 160, 89, 0.3), inset 0 0 10px rgba(197, 160, 89, 0.1);
    overflow: hidden;
    animation: goldGlow 4s infinite alternate;
    position: relative;
  }

  .brand-logo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
  }

  .brand-logo-text-fallback {
    font-size: 44px;
    color: var(--accent-light);
    z-index: 1;
    font-weight: 800;
  }

  .camp-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--accent-light);
    margin-bottom: 5px;
    line-height: 1.4;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  }

  .session-badge {
    display: inline-block;
    padding: 4px 16px;
    background: rgba(197, 160, 89, 0.15);
    color: var(--accent-light);
    border: 1px solid rgba(197, 160, 89, 0.2);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 700;
    margin-top: 5px;
  }

  /* Form inputs and labels */
  .form-group {
    margin-bottom: 20px;
    text-align: right;
  }

  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text-muted);
  }

  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    font-family: inherit;
    font-size: 15px;
    color: #ffffff;
    background: rgba(2, 19, 17, 0.65);
    border: 2px solid rgba(197, 160, 89, 0.25);
    border-radius: var(--radius-md);
    outline: none;
    transition: var(--transition);
  }

  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.15);
    background: rgba(2, 19, 17, 0.85);
  }

  .form-input::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }

  .form-input[readonly] {
    background: rgba(2, 19, 17, 0.4);
    color: var(--text-muted);
    cursor: not-allowed;
    border-color: rgba(197, 160, 89, 0.15);
  }

  /* Premium Gold Buttons */
  .btn {
    width: 100%;
    padding: 14px 24px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: var(--text-light);
    border: none;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }

  .btn-primary, .btn-accent {
    background: var(--accent-gradient);
    box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
  }

  .btn-primary:hover:not(:disabled), .btn-accent:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(197, 160, 89, 0.35);
  }

  .btn-secondary {
    background: transparent;
    border: 2px solid rgba(197, 160, 89, 0.3);
    color: var(--accent-light);
  }

  .btn-secondary:hover:not(:disabled) {
    background: rgba(197, 160, 89, 0.08);
    color: #ffffff;
    border-color: var(--accent-light);
  }

  .btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Alerts */
  .alert {
    padding: 16px;
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 22px;
    text-align: right;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    animation: slideDown 0.3s ease;
  }

  .alert-danger {
    background: rgba(239, 68, 68, 0.1);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.25);
  }

  .alert-warning {
    background: rgba(245, 158, 11, 0.1);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.25);
  }

  .alert-info {
    background: rgba(197, 160, 89, 0.1);
    color: var(--accent-light);
    border: 1px solid rgba(197, 160, 89, 0.25);
  }

  /* Success indicator checkmark styling */
  .success-badge {
    width: 90px;
    height: 90px;
    background: var(--accent-gradient);
    color: var(--primary);
    border-radius: 50%;
    margin: 10px auto 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    font-weight: bold;
    box-shadow: 0 10px 25px rgba(197, 160, 89, 0.35);
    animation: scaleUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  .success-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent-light);
    margin-bottom: 12px;
    text-align: center;
  }

  .success-text {
    font-size: 15px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  /* Spinner & Loaders */
  .spinner {
    width: 22px;
    height: 22px;
    border: 3px solid rgba(5, 55, 51, 0.2);
    border-top: 3px solid var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }

  .spinner-dark {
    border-color: rgba(197, 160, 89, 0.1);
    border-top-color: var(--accent);
  }

  .loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(1, 19, 17, 0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    border-radius: var(--radius-lg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .loading-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .loading-text {
    margin-top: 15px;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-light);
  }

  /* Student Details Row */
  .student-details {
    background: rgba(2, 19, 17, 0.45);
    border: 1px solid rgba(197, 160, 89, 0.2);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 25px;
    text-align: right;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 14px;
    border-bottom: 1px solid rgba(197, 160, 89, 0.1);
  }
  .detail-row:last-child {
    border-bottom: none;
  }

  .detail-label {
    color: var(--text-muted);
    font-weight: 600;
  }

  .detail-val {
    color: #ffffff;
    font-weight: 700;
  }

  /* Inline loading spinner for Phone Check */
  .input-wrapper {
    position: relative;
  }
  
  .inline-spinner {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border: 2px solid rgba(197, 160, 89, 0.2);
    border-top: 2px solid var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    z-index: 5;
  }
  
  /* Phone Status Badges */
  .phone-status-badge {
    margin-top: 8px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.5;
    animation: slideDown 0.3s ease;
  }
  
  .status-registered {
    background: rgba(197, 160, 89, 0.15);
    color: var(--accent-light);
    border: 1px solid rgba(197, 160, 89, 0.35);
  }
  
  .status-new {
    background: rgba(59, 130, 246, 0.15);
    color: #93c5fd;
    border: 1px solid rgba(59, 130, 246, 0.35);
  }
  
  .status-attended {
    background: rgba(245, 158, 11, 0.15);
    color: #fcd34d;
    border: 1px solid rgba(245, 158, 11, 0.35);
  }

  /* Animations */
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes goldGlow {
    0% { box-shadow: 0 0 15px rgba(197, 160, 89, 0.25); }
    100% { box-shadow: 0 0 25px rgba(197, 160, 89, 0.5); }
  }

  @keyframes scaleUp {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes slideDown {
    0% { transform: translateY(-10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* Styled English Brand Title */
  .camp-title-styled {
    font-family: 'Outfit', 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 25px;
    font-weight: 800;
    margin: 5px 0 3px;
    line-height: 1.2;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    letter-spacing: 0.5px;
    direction: ltr;
  }

  .title-internship {
    color: #ffffff;
    font-weight: 800;
  }

  .title-camp {
    color: var(--accent);
    font-weight: 800;
  }

  .heartbeat-svg {
    width: 38px;
    height: 16px;
    opacity: 0.9;
    flex-shrink: 0;
  }
  
  .heartbeat-left {
    margin-left: 1px;
  }
  
  .heartbeat-right {
    margin-right: 1px;
  }

  .camp-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 8px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  }

  /* Responsive breakpoints */
  @media(max-width: 480px) {
    body {
      padding: 10px;
    }
    .card {
      padding: 30px 20px;
    }
    .brand-logo-container {
      width: 100px;
      height: 100px;
    }
    .camp-title {
      font-size: 18px;
    }
    .camp-title-styled {
      font-size: 20px;
      gap: 6px;
    }
    .heartbeat-svg {
      width: 28px;
      height: 12px;
    }
  }

  /* Popups/Modals */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(1, 19, 18, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 420px;
    padding: 35px 25px;
    text-align: center;
    position: relative;
    transform: scale(0.85);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .modal-overlay.active .modal-card {
    transform: scale(1);
  }

  .success-icon-container {
    width: 80px;
    height: 80px;
    background: rgba(197, 160, 89, 0.15);
    border: 2px solid var(--accent);
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 15px rgba(197, 160, 89, 0.2);
  }

  .success-icon {
    font-size: 40px;
    color: var(--accent);
    font-weight: bold;
    line-height: 80px;
  }

  .success-message {
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    margin: 10px 0 5px;
  }

  .success-message-sub {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* Extra mobile optimization to fit small screens */
  @media(max-height: 600px) {
    .modal-card {
      padding: 20px 20px;
    }
    .success-icon-container {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
    }
    .success-icon {
      font-size: 30px;
      line-height: 60px;
    }
  }
</style>
