  function callServerOption(action, args, onSuccess, onFailure) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      var runner = google.script.run;
      if (onSuccess) runner = runner.withSuccessHandler(onSuccess);
      if (onFailure) runner = runner.withFailureHandler(onFailure);
      runner[action].apply(runner, args);
    } else {
      // Hybrid mode - call Apps Script via HTTP fetch POST
      fetch(API_URL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({ action: action, args: args })
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        if (data && data.error) {
          if (onFailure) onFailure(new Error(data.error));
        } else {
          if (onSuccess) onSuccess(data);
        }
      })
      .catch(function(err) {
        if (onFailure) onFailure(err);
      });
    }
  }

  function normalizeLogoUrl(url) {
    if (!url || url === "logo.jpg") return defaultLogoBase64;
    if (!url) return "logo.jpg";
    var cleanUrl = url.toString().trim();
    
    if (cleanUrl.indexOf("drive.google.com") !== -1 || cleanUrl.indexOf("docs.google.com") !== -1) {
      var fileDMatch = cleanUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileDMatch && fileDMatch[1]) {
        return "https://lh3.googleusercontent.com/d/" + fileDMatch[1];
      }
      var idParamMatch = cleanUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (idParamMatch && idParamMatch[1]) {
        return "https://lh3.googleusercontent.com/d/" + idParamMatch[1];
      }
    }
    return cleanUrl;
  }

  function onSettingsLoaded(settings) {
    hideLoading();
    if (settings.error) {
      showGlobalError("حدث خطأ أثناء تحميل الإعدادات: " + settings.error);
      return;
    }

    state.campName = settings.CampName;
    state.session = settings.CurrentSession;
    state.isClosed = settings.Attendance.toString().toUpperCase() !== "OPEN";
    state.feedbackOpen = settings.Feedback.toString().toUpperCase() === "OPEN";
    state.logoUrl = normalizeLogoUrl(settings.LogoURL);

    // Update Facebook Links
    var fbUrls = document.querySelectorAll('.facebook-link-href');
    fbUrls.forEach(function(el) {
      el.href = settings.FacebookURL || "https://www.facebook.com/profile.php?id=61575638669904";
    });

    // Update Headers and Logo in UI
    updateCampBranding();

    if (state.isClosed) {
      showScreen('screen-closed');
    } else {
      showScreen('screen-phone');
    }
  }

  function onSettingsError(err) {
    hideLoading();
    showGlobalError("فشل الاتصال بالخادم: " + err.message);
  }

  function getSessionDisplayName(sessionVal) {
    if (sessionVal === null || sessionVal === undefined) return "المحاضرة ..";
    var idx = parseInt(sessionVal.toString().trim(), 10);
    if (!isNaN(idx) && idx >= 0 && idx < sessionsGuide.length) {
      return sessionsGuide[idx];
    }
    return "المحاضرة " + sessionVal;
  }

  /**
   * Updates camp titles, logo images, and badge text across all screens.
   */
  function updateCampBranding() {
    var subtitles = document.querySelectorAll('.dynamic-camp-subtitle');
    subtitles.forEach(function(el) {
      el.textContent = state.campName;
    });

    var badges = document.querySelectorAll('.dynamic-session-badge');
    badges.forEach(function(el) {
      el.textContent = getSessionDisplayName(state.session);
    });

    var logos = document.querySelectorAll('.dynamic-logo-img');
    logos.forEach(function(el) {
      if (state.logoUrl) {
        el.src = state.logoUrl;
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    });
  }

  /**
   * Screen Navigation Utility.
   * Handles smooth transitions.
   */
  function showScreen(screenId) {
    var screens = document.querySelectorAll('.screen');
    var targetScreen = document.getElementById(screenId);

    if (!targetScreen) return;

    // Hide active screens
    screens.forEach(function(scr) {
      if (scr.classList.contains('active')) {
        scr.classList.remove('active');
        scr.style.display = 'none';
      }
    });

    // Show target screen
    targetScreen.style.display = 'block';
    // Force reflow for CSS transition
    void targetScreen.offsetWidth;
    targetScreen.classList.add('active');
  }

  /**
   * Displays loading overlays.
   */
  function showLoading(text) {
    var overlay = document.getElementById('loading-overlay');
    var overlayText = document.getElementById('loading-text');
    if (overlay) {
      overlayText.textContent = text || "جاري التحميل...";
      overlay.classList.add('active');
    }
  }

  function hideLoading() {
    var overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.classList.remove('active');
    }
  }

  /**
   * Renders professional alerts.
   */
  function showAlert(containerId, message, type) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var alertClass = 'alert-info';
    var icon = 'ℹ️';

    if (type === 'danger') {
      alertClass = 'alert-danger';
      icon = '⚠️';
    } else if (type === 'warning') {
      alertClass = 'alert-warning';
      icon = '🔔';
    }

    container.innerHTML = 
      '<div class="alert ' + alertClass + '">' +
        '<span>' + icon + '</span>' +
        '<div>' + message + '</div>' +
      '</div>';
  }

  function clearAlerts() {
    var containers = ['alert-phone', 'alert-register', 'alert-confirm', 'alert-global'];
    containers.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = '';
    });
  }

  function showGlobalError(msg) {
    showAlert('alert-global', msg, 'danger');
    showScreen('screen-global-error');
  }

  /**
   * Step 1: Submit Phone Number.
   */
  // Dynamic Phone Check Timeout and States
  var checkTimeout = null;
  var lastCheckedPhone = "";
  var currentPhoneStatus = "NOT_CHECKED"; // "NOT_CHECKED", "CHECKING", "FOUND", "NOT_FOUND", "ALREADY_ATTENDED"

  /**
   * Triggers a check after 600ms of user pausing typing.
   */
  function debouncePhoneCheck() {
    var phoneInput = document.getElementById('input-phone');
    var phone = phoneInput.value;
    
    var clean = phone.replace(/[^\d]/g, "");
    if (clean.length < 8) {
      resetFormFieldsState();
      return;
    }
    
    if (clean === lastCheckedPhone) return;
    
    if (checkTimeout) clearTimeout(checkTimeout);
    checkTimeout = setTimeout(function() {
      performPhoneCheck(phone);
    }, 600);
  }

  /**
   * Triggers a check when phone input loses focus.
   */
  function triggerPhoneCheck() {
    var phoneInput = document.getElementById('input-phone');
    var phone = phoneInput.value;
    var clean = phone.replace(/[^\d]/g, "");
    
    if (clean.length >= 8 && clean !== lastCheckedPhone) {
      if (checkTimeout) clearTimeout(checkTimeout);
      performPhoneCheck(phone);
    }
  }

  /**
   * Calls the server to check student status.
   */
  function performPhoneCheck(phone) {
    var clean = phone.replace(/[^\d]/g, "");
    lastCheckedPhone = clean;
    currentPhoneStatus = "CHECKING";
    
    document.getElementById('phone-spinner').style.display = 'block';
    
    var badge = document.getElementById('phone-status-badge');
    badge.style.display = 'none';
    badge.className = 'phone-status-badge';
    
    callServerOption("checkStudentStatus", [phone], onPhoneCheckSuccess, onPhoneCheckFailure);
  }

  function onPhoneCheckSuccess(res) {
    document.getElementById('phone-spinner').style.display = 'none';
    
    var badge = document.getElementById('phone-status-badge');
    badge.style.display = 'flex';
    badge.className = 'phone-status-badge';
    
    if (res && res.error) {
      currentPhoneStatus = "ERROR";
      badge.classList.add('status-attended');
      badge.innerHTML = "<span>⚠️</span><div>حدث خطأ في النظام: " + res.error + "</div>";
      return;
    }
    
    var submitBtn = document.getElementById('btn-submit-attendance');
    submitBtn.disabled = false;
    submitBtn.style.display = 'block';
    
    var arInput = document.getElementById('input-name-ar');
    var enInput = document.getElementById('input-name-en');
    var uniInput = document.getElementById('input-university');
    var emailInput = document.getElementById('input-email');
    
    if (res.status === 'CLOSED') {
      showScreen('screen-closed');
      return;
    }
    
    if (res.status === 'ALREADY_ATTENDED') {
      currentPhoneStatus = "ALREADY_ATTENDED";
      badge.style.display = 'none';
      
      arInput.value = res.studentName || "";
      enInput.value = res.nameEn || "";
      uniInput.value = res.university || "";
      emailInput.value = res.email || "";
      
      setFormFieldsDisabled(true);
      submitBtn.disabled = true;
      submitBtn.style.display = 'none';
      
      document.getElementById('already-student-name').textContent = "مرحباً بك يا " + res.studentName;
      document.getElementById('already-session').textContent = getSessionDisplayName(res.session);
      showModal('modal-already-attended');
      
    } else if (res.status === 'FOUND') {
      currentPhoneStatus = "FOUND";
      badge.classList.add('status-registered');
      badge.innerHTML = "<span>✓</span><div>طالب مسجل مسبقاً: أهلاً بك يا " + res.studentName + "! تفضل بتسجيل حضورك.</div>";
      
      arInput.value = res.studentName || "";
      enInput.value = res.nameEn || "";
      uniInput.value = res.university || "";
      emailInput.value = res.email || "";
      
      setFormFieldsDisabled(true);
      submitBtn.textContent = "تسجيل حضور المحاضرة 📝";
      
    } else if (res.status === 'NOT_FOUND') {
      currentPhoneStatus = "NOT_FOUND";
      badge.classList.add('status-new');
      badge.innerHTML = "<span>🔔</span><div>رقم هاتف جديد: يرجى تعبئة البيانات للتسجيل في الكامب لأول مرة.</div>";
      
      arInput.value = "";
      enInput.value = "";
      uniInput.value = "";
      emailInput.value = "";
      
      setFormFieldsDisabled(false);
      submitBtn.textContent = "حفظ البيانات وتسجيل الحضور 💾";
      
    } else if (res.status === 'INVALID_PHONE') {
      currentPhoneStatus = "INVALID_PHONE";
      badge.classList.add('status-attended');
      badge.innerHTML = "<span>⚠️</span><div>" + res.message + "</div>";
      submitBtn.disabled = true;
    }
  }

  function onPhoneCheckFailure(err) {
    document.getElementById('phone-spinner').style.display = 'none';
    var badge = document.getElementById('phone-status-badge');
    badge.style.display = 'flex';
    badge.className = 'phone-status-badge status-attended';
    badge.innerHTML = "<span>⚠️</span><div>فشل التحقق من الرقم: " + err.message + "</div>";
  }

  /**
   * Helper to enable/disable registration inputs.
   */
  function setFormFieldsDisabled(disabled) {
    document.getElementById('input-name-ar').disabled = disabled;
    document.getElementById('input-name-en').disabled = disabled;
    document.getElementById('input-university').disabled = disabled;
    document.getElementById('input-email').disabled = disabled;
  }

  /**
   * Resets form fields state when phone is short or cleared.
   */
  function resetFormFieldsState() {
    lastCheckedPhone = "";
    currentPhoneStatus = "NOT_CHECKED";
    
    document.getElementById('phone-spinner').style.display = 'none';
    document.getElementById('phone-status-badge').style.display = 'none';
    
    var arInput = document.getElementById('input-name-ar');
    var enInput = document.getElementById('input-name-en');
    var uniInput = document.getElementById('input-university');
    var emailInput = document.getElementById('input-email');
    
    arInput.value = "";
    enInput.value = "";
    uniInput.value = "";
    emailInput.value = "";
    
    setFormFieldsDisabled(false);
    
    var submitBtn = document.getElementById('btn-submit-attendance');
    submitBtn.disabled = false;
    submitBtn.style.display = 'block';
    submitBtn.textContent = "تسجيل حضور الكامب";
  }

  /**
   * Handles submission of the unified main form.
   */
  function handleFormSubmit(e) {
    if (e) e.preventDefault();
    clearAlerts();
    
    var phoneInput = document.getElementById('input-phone');
    var phone = phoneInput.value.trim();
    
    if (phone.replace(/[^\d]/g, "").length < 8) {
      showAlert('alert-phone', 'يرجى إدخال رقم هاتف صحيح.', 'danger');
      return;
    }
    
    if (currentPhoneStatus === "CHECKING") {
      showAlert('alert-phone', 'جاري التحقق من الرقم، يرجى الانتظار...', 'warning');
      return;
    }
    
    if (currentPhoneStatus === "ALREADY_ATTENDED") {
      showAlert('alert-phone', 'لقد سجلت حضورك بالفعل لهذه المحاضرة.', 'warning');
      return;
    }

    if (currentPhoneStatus === "NOT_FOUND") {
      var nameAr = document.getElementById('input-name-ar').value;
      var nameEn = document.getElementById('input-name-en').value;
      var university = document.getElementById('input-university').value;
      var email = document.getElementById('input-email').value;

      var nameArRegex = /^[\u0600-\u06FF\s]+$/;
      var nameEnRegex = /^[a-zA-Z\s]+$/;
      var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      var cleanAr = nameAr.trim();
      var cleanEn = nameEn.trim();

      if (!nameAr || !nameArRegex.test(cleanAr) || cleanAr.split(/\s+/).length < 3) {
        showAlert('alert-phone', 'الاسم باللغة العربية يجب أن يتكون من حروف عربية فقط ويجب أن يكون ثلاثياً على الأقل.', 'danger');
        return;
      }
      if (!nameEn || !nameEnRegex.test(cleanEn) || cleanEn.split(/\s+/).length < 3) {
        showAlert('alert-phone', 'الاسم باللغة الإنجليزية يجب أن يتكون من حروف إنجليزية فقط ويجب أن يكون ثلاثياً على الأقل.', 'danger');
        return;
      }
      if (!university || university.trim().length < 2) {
        showAlert('alert-phone', 'يرجى إدخال اسم الجامعة بشكل صحيح.', 'danger');
        return;
      }
      if (!email || !emailRegex.test(email.trim().toLowerCase())) {
        showAlert('alert-phone', 'يرجى إدخال بريد إلكتروني صحيح وصالح.', 'danger');
        return;
      }

      var studentData = {
        Phone: phone,
        NameAr: nameAr,
        NameEn: nameEn,
        University: university,
        Email: email
      };

      showLoading("جاري حفظ البيانات وتسجيل حضورك...");
      
      callServerOption("registerStudentAndAttend", [studentData], onAttendanceRegistered, onRegisterError);
      
    } else {
      showLoading("جاري تسجيل حضورك...");
      
      callServerOption("submitAttendance", [phone], onAttendanceRegistered, onAttendanceError);
    }
  }

  function onAttendanceRegistered(res) {
    hideLoading();
    if (res.error) {
      document.getElementById('error-message-text').textContent = res.error;
      showModal('modal-error');
      return;
    }

    if (res.alreadyMarked) {
      document.getElementById('already-student-name').textContent = res.studentName;
      document.getElementById('already-session').textContent = getSessionDisplayName(res.session);
      showModal('modal-already-attended');
      return;
    }

    document.getElementById('success-student-name').textContent = res.studentName;
    document.getElementById('success-session-info').textContent = "تم تسجيل حضورك بنجاح في: " + getSessionDisplayName(res.session);
    

    
    showModal('modal-success');

    startRedirectTimer();
  }

  function onAttendanceError(err) {
    hideLoading();
    document.getElementById('error-message-text').textContent = "فشل تسجيل الحضور: " + err.message;
    showModal('modal-error');
  }

  function onRegisterError(err) {
    hideLoading();
    document.getElementById('error-message-text').textContent = "فشل تسجيل البيانات: " + err.message;
    showModal('modal-error');
  }

  var timerId = null;
  function resetFlow() {
    if (timerId) {
      clearTimeout(timerId);
      timerId = null;
    }
    
    // Close all modals
    var modals = document.querySelectorAll('.modal-overlay');
    modals.forEach(function(m) {
      m.classList.remove('active');
    });

    document.getElementById('input-phone').value = '';
    resetFormFieldsState();
    
    clearAlerts();
    
    showScreen('screen-phone');
    
    initApp();
  }

  function startRedirectTimer() {
    var timerEl = document.getElementById('success-timer');
    var countdown = 6;
    timerEl.textContent = countdown;
    
    if (timerId) clearInterval(timerId);
    
    timerId = setInterval(function() {
      countdown--;
      timerEl.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timerId);
        timerId = null;
        resetFlow();
      }
    }, 1000);
  }

  function showModal(id) {
    var modal = document.getElementById(id);
    if (modal) {
      modal.classList.add('active');
    }
  }

  function closeModal(id) {
    var modal = document.getElementById(id);
    if (modal) {
      modal.classList.remove('active');
    }
    if (id === 'modal-success' || id === 'modal-already-attended') {
      resetFlow();
    }
  }
</script>
