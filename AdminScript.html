<script>
  // Admin State
  var state = {
    pin: "",
    config: {},
    stats: {},
    logoUrl: ""
  };
  var isDataLoading = false;

  var sessionsGuideList = [
    "التمهيد والترحيب (Opening & Orientation)",
    "Interview Skills, CV Writing & LinkedIn",
    "Professional Autonomy & Accountability",
    "ECG Interpretation",
    "Medication Safety & High Alert Medications",
    "ABG Interpretation & Patient Deterioration",
    "Trauma, Stroke & Acute Coronary Syndrome",
    "Care of Mechanically Ventilated Patients",
    "Panic Situations - Lines, Tubes & Drains",
    "Code Blue Management & Crash Cart",
    "Infection Prevention and Control (IPC)",
    "Quality Improvement & Patient Safety",
    "Soft Skills",
    "Communication Skills, SBAR & Documentation",
    "Career Development & Opportunities",
    "المناقشة المفتوحة وحفل الختام (Closing Ceremony)"
  ];

  function getSessionName(sessionVal) {
    var idx = parseInt(sessionVal.toString().trim(), 10);
    if (!isNaN(idx) && idx >= 0 && idx < sessionsGuideList.length) {
      return sessionsGuideList[idx];
    }
    return "المحاضرة " + sessionVal;
  }

  document.addEventListener('DOMContentLoaded', function() {
    initAdminApp();
  });

  var API_URL = "https://script.google.com/macros/s/AKfycbxwvoZxEKxJ72BijGNmtV8lMvnldzQOYEmk_bYr_j3OCM_J3RFbTarpFfphhvfC2Ezy/exec";

  function getMockResponse(action, args) {
    if (action === "verifyAdminPIN") {
      if (args[0] === "1234") return true;
      return { error: "رمز التحقق غير صحيح" };
    }
    if (action === "getAdminDashboardData") {
      return {
        settings: {
          CampName: "مبادرة ما ينفع الناس - كامب التمريض",
          CurrentSession: "0",
          MinAttendance: 5,
          Attendance: "OPEN",
          Quiz: "CLOSED",
          Feedback: "CLOSED",
          LogoURL: "",
          FacebookURL: "https://www.facebook.com/maynfa3.alnas",
          FeedbackSession: "0"
        },
        stats: {
          totalRegistered: 154,
          currentSessionAttendees: 89,
          currentSessionQuizTakers: 42,
          averageQuizScore: 8.5,
          currentSessionFeedbackTakers: 35,
          certificateEligibleCount: 97
        },
        sessions: [
          { "Index": "0", "Session Topic": "التمهيد والترحيب (Opening & Orientation)", "Instructor": "Dr. Mohamed Mansour", "Date & Day": "الجمعة", "Time": "6:00 PM" },
          { "Index": "1", "Session Topic": "Interview Skills & CV Writing", "Instructor": "Dr. Ali Abdelfatah", "Date & Day": "الجمعة", "Time": "6:00 PM" },
          { "Index": "2", "Session Topic": "Professional Autonomy", "Instructor": "Dr. Mohamed Elbehairy", "Date & Day": "السبت", "Time": "6:00 PM" }
        ],
        serverTime: "2026-08-01T14:40:00"
      };
    }
    if (action === "updateAdminSettings") {
      return {
        success: true,
        settings: {
          CampName: args[1].CampName || "مبادرة ما ينفع الناس - كامب التمريض",
          CurrentSession: args[1].CurrentSession || "0",
          MinAttendance: args[1].MinAttendance || 5,
          Attendance: args[1].Attendance || "OPEN",
          Quiz: args[1].Quiz || "CLOSED",
          Feedback: args[1].Feedback || "CLOSED",
          LogoURL: args[1].LogoURL || "",
          FacebookURL: args[1].FacebookURL || "https://www.facebook.com/maynfa3.alnas",
          FeedbackSession: args[1].FeedbackSession || "0"
        },
        stats: {
          totalRegistered: 154,
          currentSessionAttendees: 89,
          currentSessionQuizTakers: 42,
          averageQuizScore: 8.5,
          currentSessionFeedbackTakers: 35,
          certificateEligibleCount: 97
        },
        sessions: [
          { "Index": "0", "Session Topic": "التمهيد والترحيب (Opening & Orientation)", "Instructor": "Dr. Mohamed Mansour", "Date & Day": "الجمعة", "Time": "6:00 PM" },
          { "Index": "1", "Session Topic": "Interview Skills & CV Writing", "Instructor": "Dr. Ali Abdelfatah", "Date & Day": "الجمعة", "Time": "6:00 PM" },
          { "Index": "2", "Session Topic": "Professional Autonomy", "Instructor": "Dr. Mohamed Elbehairy", "Date & Day": "السبت", "Time": "6:00 PM" }
        ],
        serverTime: "2026-08-01T14:40:00"
      };
    }
    return { error: "Unknown mock action" };
  }

  function callServerOption(action, args, onSuccess, onFailure) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      var runner = google.script.run;
      if (onSuccess) runner = runner.withSuccessHandler(onSuccess);
      if (onFailure) runner = runner.withFailureHandler(onFailure);
      runner[action].apply(runner, args);
    } else if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      console.log("[Mock Server] Called " + action + " with args:", args);
      setTimeout(function() {
        var mockResult = getMockResponse(action, args);
        if (mockResult && mockResult.error) {
          if (onFailure) onFailure(new Error(mockResult.error));
        } else {
          if (onSuccess) onSuccess(mockResult);
        }
      }, 500);
    } else {
      // Hybrid mode - call Apps Script via HTTP fetch POST
      fetch(API_URL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify({ action: action, args: args })
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(data) {
        if (data && data.error) {
          if (onFailure) onFailure(new Error(data.error));
        } else {
          if (onSuccess) onSuccess(data);
        }
      })
      .catch(function(err) {
        if (onFailure) onFailure(err);
      });
    }
  }

  function initAdminApp() {
    clearAlerts();
    populateSessionDropdown();
    setupAutoSaveListeners();
    setupTextAutoSaveListeners();

    // Load public settings first to show logo and name on login screen
    showLoading("جاري تحميل إعدادات النظام...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onPublicSettingsLoaded)
        .withFailureHandler(function(err) {
          hideLoading();
          checkStoredPin();
        })
        .getSystemSettings();
    } else {
      // Local Mock Settings Load
      setTimeout(function() {
        onPublicSettingsLoaded({
          CampName: "Nursing Internship Camp (Local Mock)",
          LogoURL: "https://lh3.googleusercontent.com/d/167rdAQntynxuH3mRHZYa6eabz4qRiyYR"
        });
      }, 1000);
    }
  }

  function onPublicSettingsLoaded(res) {
    hideLoading();
    if (res && !res.error) {
      state.campName = res.CampName || "";
      state.logoUrl = normalizeLogoUrl(res.LogoURL);

      // Update UI with public branding
      var subtitles = document.querySelectorAll('.dynamic-camp-subtitle');
      subtitles.forEach(function(el) {
        el.textContent = state.campName;
      });

      // Update Logos
      var logos = document.querySelectorAll('.dynamic-logo-img');
      logos.forEach(function(el) {
        if (state.logoUrl) {
          el.src = state.logoUrl;
          el.style.display = 'block';
        } else {
          el.style.display = 'none';
        }
      });
    }

    checkStoredPin();
  }

  function checkStoredPin() {
    var storedPin = sessionStorage.getItem("admin_pin");
    if (storedPin) {
      loadDashboardData(storedPin);
    }
  }

  function populateSessionDropdown() {
    var select = document.getElementById("select-admin-session");
    var selectFeedback = document.getElementById("select-admin-feedback-session");
    
    if (select) {
      select.innerHTML = "";
      for (var i = 0; i < sessionsGuideList.length; i++) {
        var opt = document.createElement("option");
        opt.value = i.toString();
        opt.textContent = getSessionName(i);
        select.appendChild(opt);
      }
    }
    
    if (selectFeedback) {
      selectFeedback.innerHTML = "";
      for (var i = 0; i < sessionsGuideList.length; i++) {
        var opt = document.createElement("option");
        opt.value = i.toString();
        opt.textContent = getSessionName(i);
        selectFeedback.appendChild(opt);
      }
    }
  }

  function handleLoginSubmit(e) {
    if (e) e.preventDefault();
    clearAlerts();

    var pinInput = document.getElementById("input-admin-pin");
    var pinVal = pinInput.value.trim();

    if (!pinVal) {
      showAlert("login-alert", "يرجى إدخال رمز التحقق.", "danger");
      return;
    }

    showLoading("جاري التحقق من الصلاحيات الإدارية...");

    callServerOption("verifyAdminPIN", [pinVal], function(res) {
      if (res.error) {
        hideLoading();
        showAlert("login-alert", res.error, "danger");
      } else {
        sessionStorage.setItem("admin_pin", pinVal);
        loadDashboardData(pinVal);
      }
    }, function(err) {
      hideLoading();
      showAlert("login-alert", "حدث خطأ أثناء الاتصال: " + err.message, "danger");
    });
  }

  function loadDashboardData(pin) {
    showLoading("جاري جلب إحصائيات وإعدادات النظام...");
    state.pin = pin;

    callServerOption("getAdminDashboardData", [pin], onDashboardDataLoaded, onDashboardError);
  }

  function onDashboardDataLoaded(res) {
    hideLoading();
    if (res.error) {
      sessionStorage.removeItem("admin_pin");
      showAlert("login-alert", res.error, "danger");
      showScreen("screen-admin-login");
      return;
    }

    state.config = res.settings;
    state.stats = res.stats;
    state.sessions = res.sessions || [];
    state.logoUrl = normalizeLogoUrl(res.settings.LogoURL);

    isDataLoading = true;

    // Update UI Form fields first so dropdown values are set
    document.getElementById("admin-camp-title").textContent = res.settings.CampName;
    document.getElementById("select-admin-session").value = res.settings.CurrentSession;
    if (document.getElementById("select-admin-feedback-session")) {
      document.getElementById("select-admin-feedback-session").value = res.settings.FeedbackSession || res.settings.CurrentSession;
    }
    document.getElementById("toggle-attendance-status").checked = (res.settings.Attendance === "OPEN");
    document.getElementById("toggle-quiz-status").checked = (res.settings.Quiz === "OPEN");
    document.getElementById("toggle-feedback-status").checked = (res.settings.Feedback === "OPEN");
    document.getElementById("input-admin-camp-name").value = res.settings.CampName || "";
    document.getElementById("input-admin-min-attendance").value = res.settings.MinAttendance;
    document.getElementById("input-admin-logo-url").value = res.settings.LogoURL || "";
    document.getElementById("input-admin-facebook-url").value = res.settings.FacebookURL || "";
    document.getElementById("input-admin-new-pin").value = "";

    // Update UI Stats
    document.getElementById("stat-registered").textContent = res.stats.totalRegistered;
    document.getElementById("stat-attendees").textContent = res.stats.currentSessionAttendees;
    document.getElementById("stat-quiz-takers").textContent = res.stats.currentSessionQuizTakers;
    
    var avgNum = parseFloat(res.stats.averageQuizScore);
    document.getElementById("stat-quiz-avg").textContent = isNaN(avgNum) || avgNum <= 0 ? "0%" : (avgNum * 10).toFixed(0) + "%";
    
    document.getElementById("stat-feedback-takers").textContent = res.stats.currentSessionFeedbackTakers || 0;
    document.getElementById("stat-eligible").textContent = res.stats.certificateEligibleCount || 0;

    // Update System Status Banner
    updateStatusBadges();
    renderActiveSessionInfo();

    // Set Last Sync time
    var syncTimeStr = "";
    if (res.serverTime) {
      var tParts = res.serverTime.split("T");
      if (tParts.length > 1) {
        syncTimeStr = tParts[1];
      } else {
        syncTimeStr = formatTimestamp(new Date());
      }
    } else {
      syncTimeStr = formatTimestamp(new Date());
    }
    document.getElementById("health-last-sync").textContent = syncTimeStr;

    isDataLoading = false;

    // Update Logos
    var logos = document.querySelectorAll('.dynamic-logo-img');
    logos.forEach(function(el) {
      if (state.logoUrl) {
        el.src = state.logoUrl;
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    });

    // Populate URLs
    var baseUrl = "https://script.google.com/macros/s/AKfycbxwvoZxEKxJ72BijGNmtV8lMvnldzQOYEmk_bYr_j3OCM_J3RFbTarpFfphhvfC2Ezy/exec";
    
    document.getElementById("link-attendance-url").value = baseUrl;
    document.getElementById("link-quiz-url").value = baseUrl + "?page=quiz";
    document.getElementById("link-feedback-url").value = baseUrl + "?page=feedback";

    showScreen("screen-admin-dashboard");
  }

  function onDashboardError(err) {
    hideLoading();
    sessionStorage.removeItem("admin_pin");
    showAlert("login-alert", "فشل تحميل لوحة التحكم: " + err.message, "danger");
    showScreen("screen-admin-login");
  }

  function normalizeLogoUrl(url) {
    if (!url) return "";
    var drivePattern = /drive\.google\.com\/file\/d\/([^\/]+)/;
    var match = url.match(drivePattern);
    if (match && match[1]) {
      return "https://lh3.googleusercontent.com/d/" + match[1];
    }
    return url;
  }

  function saveDashboardSettings() {
    clearAlerts();
    var sessionVal = document.getElementById("select-admin-session").value;
    var feedbackSessionVal = document.getElementById("select-admin-feedback-session").value;
    var attendanceOpen = document.getElementById("toggle-attendance-status").checked ? "OPEN" : "CLOSED";
    var quizOpen = document.getElementById("toggle-quiz-status").checked ? "OPEN" : "CLOSED";
    var feedbackOpen = document.getElementById("toggle-feedback-status").checked ? "OPEN" : "CLOSED";
    var campNameVal = document.getElementById("input-admin-camp-name").value.trim();
    var minAttendance = Number(document.getElementById("input-admin-min-attendance").value);
    var logoUrlVal = document.getElementById("input-admin-logo-url").value.trim();
    var facebookUrlVal = document.getElementById("input-admin-facebook-url").value.trim();
    var newPinVal = document.getElementById("input-admin-new-pin").value.trim();

    if (!campNameVal) {
      showAlert("dashboard-alert", "يرجى كتابة اسم الكامب التدريبي.", "danger");
      return;
    }

    if (isNaN(minAttendance) || minAttendance < 1 || minAttendance > 16) {
      showAlert("dashboard-alert", "يرجى كتابة عدد صحيح مقبول للحد الأدنى من المحاضرات (بين 1 و 16).", "danger");
      return;
    }

    showLoading("جاري حفظ التغييرات وتعميمها...");

    var updates = {
      CurrentSession: sessionVal,
      FeedbackSession: feedbackSessionVal,
      Attendance: attendanceOpen,
      Quiz: quizOpen,
      Feedback: feedbackOpen,
      CampName: campNameVal,
      MinAttendance: minAttendance,
      LogoURL: logoUrlVal,
      FacebookURL: facebookUrlVal
    };

    if (newPinVal !== "") {
      updates.AdminPIN = newPinVal;
    }

    callServerOption("updateAdminSettings", [state.pin, updates], function(res) {
      if (newPinVal !== "") {
        state.pin = newPinVal;
        sessionStorage.setItem("admin_pin", newPinVal);
      }
      onDashboardDataLoaded(res);
      showAlert("dashboard-alert", "تم حفظ الإعدادات وتحديث الجداول بنجاح سحابياً! 🚀", "success");
    }, function(err) {
      hideLoading();
      showAlert("dashboard-alert", "فشل حفظ الإعدادات: " + err.message, "danger");
    });
  }

  function handleLogout() {
    sessionStorage.removeItem("admin_pin");
    state.pin = "";
    document.getElementById("input-admin-pin").value = "";
    showScreen("screen-admin-login");
  }

  function copyToClipboard(elementId) {
    var copyText = document.getElementById(elementId);
    if (!copyText) return;

    copyText.select();
    copyText.setSelectionRange(0, 99999); // For mobile devices

    try {
      navigator.clipboard.writeText(copyText.value);
      alert("تم نسخ النص إلى الحافظة بنجاح! 📋");
    } catch (err) {
      // Fallback
      document.execCommand("copy");
      alert("تم نسخ النص إلى الحافظة! 📋");
    }
  }

  function openModal() {
    document.getElementById("announcement-modal").classList.add("active");
  }

  function closeModal() {
    document.getElementById("announcement-modal").classList.remove("active");
  }

  function showScreen(screenId) {
    var screens = document.querySelectorAll('.screen');
    var targetScreen = document.getElementById(screenId);

    if (!targetScreen) return;

    var container = document.querySelector('.app-container');
    if (container) {
      if (screenId === 'screen-admin-dashboard') {
        container.classList.add('dashboard-mode');
      } else {
        container.classList.remove('dashboard-mode');
      }
    }

    screens.forEach(function(scr) {
      if (scr.classList.contains('active')) {
        scr.classList.remove('active');
        scr.style.display = 'none';
      }
    });

    targetScreen.style.display = 'block';
    void targetScreen.offsetWidth; // Force reflow
    targetScreen.classList.add('active');
  }

  function showLoading(text) {
    var overlay = document.getElementById('loading-overlay');
    var overlayText = document.getElementById('loading-text');
    if (overlay) {
      overlayText.textContent = text || "جاري التحميل...";
      overlay.classList.add('active');
    }
  }

  function hideLoading() {
    var overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.classList.remove('active');
    }
  }

  function showAlert(containerId, message, type) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var alertClass = 'alert-success';
    var icon = '✅';

    if (type === 'danger') {
      alertClass = 'alert-danger';
      icon = '⚠️';
    }

    container.innerHTML = 
      '<div class="alert ' + alertClass + '">' +
        '<span>' + icon + '</span>' +
        '<div>' + message + '</div>' +
      '</div>';
  }

  function clearAlerts() {
    var containers = ['login-alert', 'dashboard-alert'];
    containers.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerHTML = '';
    });
  }

  /* ================= AUTO-SAVE AND TOAST FUNCTIONS ================= */
  function showToast(message, type) {
    var container = document.getElementById("toast-container");
    if (!container) return;
    
    var toast = document.createElement("div");
    toast.className = "toast-msg toast-" + (type || "success");
    toast.textContent = message;
    
    container.appendChild(toast);
    
    setTimeout(function() {
      toast.style.animation = "toastSlideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) reverse";
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 300);
    }, 3000);
  }

  function updateStatusBadges() {
    var currentSessionName = getSessionName(state.config.CurrentSession);
    document.getElementById("status-current-session").textContent = currentSessionName;
    
    var attendanceBadge = document.getElementById("status-badge-attendance");
    if (state.config.Attendance === "OPEN") {
      attendanceBadge.className = "status-indicator open";
      attendanceBadge.textContent = "Attendance";
    } else {
      attendanceBadge.className = "status-indicator closed";
      attendanceBadge.textContent = "Attendance";
    }
    
    var quizBadge = document.getElementById("status-badge-quiz");
    if (state.config.Quiz === "OPEN") {
      quizBadge.className = "status-indicator open";
      quizBadge.textContent = "Quiz";
    } else {
      quizBadge.className = "status-indicator closed";
      quizBadge.textContent = "Quiz";
    }
    
    var feedbackBadge = document.getElementById("status-badge-feedback");
    if (state.config.Feedback === "OPEN") {
      feedbackBadge.className = "status-indicator open";
      feedbackBadge.textContent = "Feedback";
    } else {
      feedbackBadge.className = "status-indicator closed";
      feedbackBadge.textContent = "Feedback";
    }
  }

  function setupAutoSaveListeners() {
    // Only listen to select-admin-session change to dynamically update active session info on settings change
    document.getElementById("select-admin-session").addEventListener("change", function() {
      renderActiveSessionInfo();
    });
  }

  function autoSaveDashboardSettings(toastMessage, opName) {
    if (isDataLoading) return;
    
    var saveStatus = document.getElementById("health-save-status");
    if (saveStatus) saveStatus.textContent = "Saving...";
    
    var sessionVal = document.getElementById("select-admin-session").value;
    var feedbackSessionVal = document.getElementById("select-admin-feedback-session").value;
    var attendanceOpen = document.getElementById("toggle-attendance-status").checked ? "OPEN" : "CLOSED";
    var quizOpen = document.getElementById("toggle-quiz-status").checked ? "OPEN" : "CLOSED";
    var feedbackOpen = document.getElementById("toggle-feedback-status").checked ? "OPEN" : "CLOSED";
    var campNameVal = document.getElementById("input-admin-camp-name").value.trim();
    var minAttendance = Number(document.getElementById("input-admin-min-attendance").value);
    var logoUrlVal = document.getElementById("input-admin-logo-url").value.trim();
    var facebookUrlVal = document.getElementById("input-admin-facebook-url").value.trim();
    
    var updates = {
      CurrentSession: sessionVal,
      FeedbackSession: feedbackSessionVal,
      Attendance: attendanceOpen,
      Quiz: quizOpen,
      Feedback: feedbackOpen,
      CampName: campNameVal,
      MinAttendance: minAttendance,
      LogoURL: logoUrlVal,
      FacebookURL: facebookUrlVal
    };
    
    callServerOption("updateAdminSettings", [state.pin, updates], function(res) {
      isDataLoading = true;
      state.config = res.settings;
      state.stats = res.stats;
      if (res.sessions) {
        state.sessions = res.sessions;
      }
      
      updateStatusBadges();
      renderActiveSessionInfo();
      
      document.getElementById("stat-registered").textContent = res.stats.totalRegistered;
      document.getElementById("stat-attendees").textContent = res.stats.currentSessionAttendees;
      document.getElementById("stat-quiz-takers").textContent = res.stats.currentSessionQuizTakers;
      
      var avgNum = parseFloat(res.stats.averageQuizScore);
      document.getElementById("stat-quiz-avg").textContent = isNaN(avgNum) || avgNum <= 0 ? "0%" : (avgNum * 10).toFixed(0) + "%";
      
      document.getElementById("stat-feedback-takers").textContent = res.stats.currentSessionFeedbackTakers || 0;
      document.getElementById("stat-eligible").textContent = res.stats.certificateEligibleCount || 0;
      
      isDataLoading = false;
      
      if (saveStatus) saveStatus.textContent = "✓ كل التغييرات محفوظة";
      
      updateHealthStatus(true);
      
      var syncTimeStr = "";
      if (res.serverTime) {
        var tParts = res.serverTime.split("T");
        if (tParts.length > 1) {
          syncTimeStr = tParts[1];
        } else {
          syncTimeStr = formatTimestamp(new Date());
        }
      } else {
        syncTimeStr = formatTimestamp(new Date());
      }
      document.getElementById("health-last-sync").textContent = syncTimeStr;
      
      var finalOp = opName || "Settings Saved";
      updateLastOperation(finalOp, new Date());
      
      showToast(toastMessage || "تم حفظ التغييرات تلقائياً! 🟢", "success");
    }, function(err) {
      console.error("Auto-save failed:", err);
      if (saveStatus) saveStatus.textContent = "فشل الحفظ ❌";
      updateHealthStatus(false);
      showToast("فشل الحفظ التلقائي: " + err.message, "danger");
    });
  }

  /* ================= PHASE 2 NEW HELPER FUNCTIONS ================= */
  function switchTab(tabId) {
    var buttons = document.querySelectorAll(".tab-btn");
    buttons.forEach(function(btn) {
      btn.classList.remove("active");
    });
    document.getElementById("tab-btn-" + tabId).classList.add("active");
    
    var contents = document.querySelectorAll(".tab-content");
    contents.forEach(function(content) {
      content.classList.remove("active");
    });
    document.getElementById("tab-content-" + tabId).classList.add("active");
  }

  function getSessionName(sessionVal) {
    var idx = parseInt(sessionVal.toString().trim(), 10);
    if (state.sessions && state.sessions.length > 0) {
      var sess = state.sessions.find(function(s) {
        return parseInt(s["Index"], 10) === idx;
      });
      if (sess) {
        var topic = sess["Session Topic"] || sess["Module"] || "";
        return topic.replace(/^Session\s+\d+:\s*/i, "").replace(/^S\d+:\s*/i, "");
      }
    }
    
    if (!isNaN(idx) && idx >= 0 && idx < sessionsGuideList.length) {
      return sessionsGuideList[idx];
    }
    return "المحاضرة " + sessionVal;
  }

  function renderActiveSessionInfo() {
    var selectSess = document.getElementById("select-admin-session");
    if (!selectSess) return;
    var activeVal = selectSess.value.toString().trim();
    var activeIdx = parseInt(activeVal, 10);
    
    var sessTopic = document.getElementById("sess-info-topic");
    var sessInstructor = document.getElementById("sess-info-instructor");
    var sessDay = document.getElementById("sess-info-day");
    var sessTime = document.getElementById("sess-info-time");
    
    if (!sessTopic) return;
    
    if (state.sessions && state.sessions.length > 0) {
      var sess = state.sessions.find(function(s) {
        return parseInt(s["Index"], 10) === activeIdx;
      });
      if (sess) {
        sessTopic.textContent = sess["Session Topic"] || sess["Module"] || "-";
        sessInstructor.textContent = sess["Instructor"] || "-";
        sessDay.textContent = sess["Date & Day"] || "-";
        sessTime.textContent = sess["Time"] || "-";
        return;
      }
    }
    
    sessTopic.textContent = "المحاضرة " + activeVal;
    sessInstructor.textContent = "-";
    sessDay.textContent = "-";
    sessTime.textContent = "-";
  }



  function openLink(elementId) {
    var urlInput = document.getElementById(elementId);
    if (urlInput && urlInput.value) {
      window.open(urlInput.value, "_blank");
    }
  }

  function silentRefresh() {
    var refreshBtn = document.getElementById("health-refresh-btn");
    if (refreshBtn) refreshBtn.classList.add("spinning");
    
    updateLastOperation("Refreshing Data", new Date());
    
    callServerOption("getAdminDashboardData", [state.pin], function(res) {
      if (refreshBtn) refreshBtn.classList.remove("spinning");
      
      if (res.error) {
        updateHealthStatus(false);
        showToast("فشل تحديث البيانات: " + res.error, "danger");
        return;
      }
      
      onDashboardDataLoaded(res);
      updateHealthStatus(true);
      updateLastOperation("Refresh Completed", new Date());
      showToast("تم تحديث البيانات بنجاح ↻", "success");
    }, function(err) {
      if (refreshBtn) refreshBtn.classList.remove("spinning");
      updateHealthStatus(false);
      showToast("فشل تحديث البيانات: " + err.message, "danger");
    });
  }

  function formatTimestamp(dateObj) {
    var hours = dateObj.getHours();
    var minutes = dateObj.getMinutes();
    var ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    minutes = minutes < 10 ? '0' + minutes : minutes;
    return (hours < 10 ? '0' + hours : hours) + ':' + minutes + ' ' + ampm;
  }

  function updateHealthStatus(isHealthy) {
    var healthRow = document.getElementById("health-title-row");
    if (!healthRow) return;
    if (isHealthy) {
      healthRow.className = "health-title-row";
      healthRow.innerHTML = "<span>System Healthy</span><span>🟢</span>";
    } else {
      healthRow.className = "health-title-row failed";
      healthRow.innerHTML = "<span>Sync Failed</span><span>🔴</span>";
    }
  }

  function updateLastOperation(opName, dateObj) {
    var lastOp = document.getElementById("health-last-op");
    if (lastOp) {
      lastOp.textContent = opName + " (" + formatTimestamp(dateObj) + ")";
    }
  }

  function setupTextAutoSaveListeners() {
    var textInputs = [
      { id: "input-admin-camp-name", key: "CampName", label: "اسم الكامب" },
      { id: "input-admin-min-attendance", key: "MinAttendance", label: "الحد الأدنى للحضور" },
      { id: "input-admin-logo-url", key: "LogoURL", label: "لوجو الكامب" },
      { id: "input-admin-facebook-url", key: "FacebookURL", label: "رابط الفيسبوك" },
      { id: "input-admin-new-pin", key: "AdminPIN", label: "رمز التحقق" }
    ];
    
    textInputs.forEach(function(item) {
      var inputEl = document.getElementById(item.id);
      if (!inputEl) return;
      
      function handleSave() {
        if (isDataLoading) return;
        var val = inputEl.value.trim();
        var oldVal = (state.config[item.key] !== undefined ? state.config[item.key].toString().trim() : "");
        
        if (item.key === "MinAttendance") {
          val = Number(val);
          oldVal = Number(oldVal);
        }
        
        if (val !== oldVal && (item.key !== "AdminPIN" || val !== "")) {
          autoSaveDashboardSettings("تم حفظ " + item.label + " تلقائياً! 🟢", item.label + " Updated");
        }
      }
      
      inputEl.addEventListener("blur", handleSave);
      inputEl.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          inputEl.blur();
        }
      });
    });
  }
</script>
