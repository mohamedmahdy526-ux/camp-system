<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- Background Orbs -->
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <div class="app-wrapper">
    <div class="card">
      
      <!-- Loading Overlay -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="spinner spinner-dark"></div>
        <div id="loading-text" class="loading-text">جاري تحميل البيانات...</div>
      </div>

      <!-- ================= SCREEN: MAIN ATTENDANCE FORM ================= -->
      <div id="screen-phone" class="screen active">
        <div class="header">
          <div class="brand-logo-container">
            <span class="brand-logo-text-fallback">🤝</span>
            <img class="brand-logo-img dynamic-logo-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" onerror="this.style.display='none'" alt="Logo">
          </div>
          <h1 class="camp-title-styled">
            <svg class="heartbeat-svg heartbeat-left" viewBox="0 0 36 20"><path d="M 0 10 L 12 10 L 14 5 L 16 15 L 18 0 L 20 20 L 22 10 L 24 10 L 36 10" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="title-internship">INTERNSHIP</span>
            <span class="title-camp">CAMP</span>
            <svg class="heartbeat-svg heartbeat-right" viewBox="0 0 36 20"><path d="M 0 10 L 12 10 L 14 5 L 16 15 L 18 0 L 20 20 L 22 10 L 24 10 L 36 10" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </h1>
          <div class="camp-subtitle dynamic-camp-subtitle">تحميل الكامب التدريبي...</div>
          <span class="session-badge dynamic-session-badge">المحاضرة ..</span>
        </div>
        
        <div id="alert-phone"></div>

        <form id="attendance-main-form" onsubmit="handleFormSubmit(event)">
          <!-- Phone Group -->
          <div class="form-group">
            <label for="input-phone" class="form-label">رقم الموبايل:</label>
            <div class="input-wrapper">
              <input type="text" id="input-phone" class="form-input" placeholder="مثال: 01012345678" required inputmode="tel" oninput="debouncePhoneCheck()" onblur="triggerPhoneCheck()">
              <div id="phone-spinner" class="inline-spinner" style="display: none;"></div>
            </div>
            <!-- Dynamic Status Badge -->
            <div id="phone-status-badge" class="phone-status-badge" style="display: none;"></div>
          </div>

          <!-- Registration fields (always visible but auto-filled & read-only for old students) -->
          <div id="registration-fields">
            <div class="form-group">
              <label for="input-name-ar" class="form-label">الاسم بالكامل (باللغة العربية ثلاثي على الأقل):</label>
              <input type="text" id="input-name-ar" class="form-input" placeholder="الاسم ثلاثي باللغة العربية" required>
            </div>

            <div class="form-group">
              <label for="input-name-en" class="form-label">الاسم بالكامل (باللغة الإنجليزية ثلاثي على الأقل):</label>
              <input type="text" id="input-name-en" class="form-input" placeholder="Full name in English (At least 3 names)" required>
            </div>

            <div class="form-group">
              <label for="input-university" class="form-label">الجامعة:</label>
              <input type="text" id="input-university" class="form-input" placeholder="اسم جامعتك" required>
            </div>

            <div class="form-group">
              <label for="input-email" class="form-label">البريد الإلكتروني:</label>
              <input type="email" id="input-email" class="form-input" placeholder="example@domain.com" required style="direction: ltr; text-align: right;">
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btn-submit-attendance" class="btn btn-primary" style="margin-top: 15px; width: 100%;">
            تسجيل حضور الكامب
          </button>
        </form>

        <!-- Social Media Footer -->
        <!-- Social Media Footer -->
        <div class="social-footer" style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(197, 160, 89, 0.15); padding-top: 20px;">
          <a class="social-link facebook-link-href" href="https://www.facebook.com/profile.php?id=61575638669904" target="_blank" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: #1877f2; text-decoration: none; font-weight: 700; font-size: 15.5px; transition: color 0.3s ease;">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width: 22px; height: 22px; vertical-align: middle;">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>

    </div>

  <!-- ================= POPUP MODALS ================= -->
  <!-- Success Modal -->
  <div id="modal-success" class="modal-overlay">
    <div class="modal-card">
      <div class="success-icon-container">
        <div class="success-icon">✓</div>
      </div>
      <h2 class="success-title">تم تسجيل الحضور بنجاح!</h2>
      <p class="success-message" id="success-student-name">-</p>
      <p class="success-message-sub" id="success-session-info">تم التحضير للمحاضرة بنجاح.</p>
      
      <div class="redirect-info" style="margin-top: 25px; font-size: 13px; color: var(--text-muted);">
        سيعاد توجيهك تلقائياً خلال <span id="success-timer" style="color: var(--accent); font-weight: bold;">6</span> ثوانٍ...
      </div>

      <button onclick="closeModal('modal-success')" class="btn btn-secondary" style="margin-top: 20px; width: 100%;">
        العودة للرئيسية يدوياً 🔙
      </button>
    </div>
  </div>

  <!-- Already Attended Modal -->
  <div id="modal-already-attended" class="modal-overlay">
    <div class="modal-card">
      <div class="success-icon-container" style="background: rgba(197, 160, 89, 0.1); border-color: rgba(197, 160, 89, 0.3);">
        <div class="success-icon" style="color: var(--accent);">✓</div>
      </div>
      <h2 class="success-title" style="color: var(--accent);">مسجل حضورك مسبقاً!</h2>
      <p class="success-message" id="already-student-name">-</p>
      <p class="success-message-sub">أنت مسجل حضور بالفعل في <span id="already-session" style="color: var(--accent); font-weight: bold;">-</span>.</p>
      
      <button onclick="closeModal('modal-already-attended')" class="btn btn-primary" style="margin-top: 30px; width: 100%;">
        تسجيل حضور طالب آخر 👥
      </button>
    </div>
  </div>

  <!-- Error Modal -->
  <div id="modal-error" class="modal-overlay">
    <div class="modal-card">
      <div class="success-icon-container" style="background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.3);">
        <div class="success-icon" style="color: var(--danger);">✕</div>
      </div>
      <h2 class="success-title" style="color: var(--danger);">فشل عملية التسجيل</h2>
      <p class="success-message-sub" id="error-message-text" style="font-size: 15px; margin-top: 10px; color: var(--text-main); font-weight: 500;">-</p>
      
      <button onclick="closeModal('modal-error')" class="btn btn-secondary" style="margin-top: 25px; width: 100%;">
        إغلاق ومحاولة أخرى 🔄
      </button>
    </div>
